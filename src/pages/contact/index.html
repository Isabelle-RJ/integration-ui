    <link rel="stylesheet" href="../../index.css">

<body>
<header>
    <div class="bg-banner">
        <nav>
            <h1><a href="../../index.html" class="home">White<span class="title-certif">Certification</span></a></h1>
            <div class="menu-nav-links">
                <a href="../../index.html" class="nav-link">Home</a>
                <a href="../services/index.html" class="nav-link">Services</a>
                <a href="../blog/index.html" class="nav-link">Blog</a>
                <a href="../contact/index.html" class="nav-link active">Contact</a>
            </div>
        </nav>
        <section class="little-text-banner">
            <p>Pour nous contacter, il faut remplir le formulaire !</p>
        </section>
        <section class="text-btn-banner">
            <h2>We do it with fingers in the nose</h2>
            <div class="btn-banner">
                <button class="btn-services">SEE SERVICES</button>
                <button class="btn-learn-more">LEARN MORE</button>
            </div>
        </section>
    </div>
</header>
<main>
    <section class="form">
        <form method="get" action="">
            <fieldset>
                <legend>Contact us</legend>
                <label>Votre prénom</label>
                <input type="text" name="prenom" required>

                <label>Votre nom</label>
                <input type="text" name="name" required>

                <label>Votre adresse email</label>
                <input type="email" name="email" required>

                <label>Votre mot de passe</label>
                <input type="password" name="password" required>

                <input type="submit" value="Envoyer">
            </fieldset>
        </form>
    </section>
</main>
<footer>
